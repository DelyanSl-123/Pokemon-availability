# Start everything:  docker compose up --build
# Open:              http://localhost:3001
#
# Settings come from backend/.env (copy backend/.env.example). HOST, PORT and DB_PATH
# are set by the image, so values for them in .env are ignored here.
services:
  app:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      DB_PATH: /data/tracker.db
    volumes:
      - app-data:/data
    restart: unless-stopped

volumes:
  app-data:
