name: Daily Pokemon TCG check

on:
  schedule:
    # GitHub cron is always UTC: 06:00 UTC = 09:00 in Sofia during summer time, 08:00 in winter.
    - cron: '0 6 * * *'
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write # publish the HTML report to GitHub Pages
  id-token: write

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # The SQLite file remembers what was seen before, so "NEW" / "BACK IN STOCK" flags work.
      - name: Restore previous results
        id: db-cache
        uses: actions/cache/restore@v4
        with:
          path: backend/data
          key: tracker-db-${{ github.run_id }}
          restore-keys: tracker-db-

      - name: Check shops
        run: npm run check
        env:
          # Web app address for the report's sign-in icon (repository variable, not a secret)
          APP_URL: ${{ vars.APP_URL }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-report
          path: backend/report/report.html
          if-no-files-found: ignore
          retention-days: 14

      # Same report as a web page at https://<user>.github.io/<repo>/ (always the latest run).
      - name: Prepare GitHub Pages site
        id: pages-site
        if: always() && hashFiles('backend/report/report.html') != ''
        run: |
          mkdir -p ../_site
          cp report/report.html ../_site/index.html
          printf 'User-agent: *\nDisallow: /\n' > ../_site/robots.txt

      - name: Upload GitHub Pages site
        if: always() && steps.pages-site.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deployment
        if: always() && steps.pages-site.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Save results for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: backend/data
          key: tracker-db-${{ github.run_id }}
